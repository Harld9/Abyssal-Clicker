<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- CSS -->
  <link href="./static/css/main.css" rel="stylesheet">
  <link href="./static/css/index.css" rel="stylesheet" />

  <!-- Police Poppins via Google Fonts -->
  <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
  />

  <title>Abyssal Clicker</title>
</head>

<body>
<div id="interface">

  <!-- Colonne gauche : score + poisson cliquable -->
  <div id="poisson-score">
    <div id="score">
      <p>Score</p>
      <p id="nbScore">25900000</p>
    </div>
    <div id="poisson">
<button id="imgPoisson">
  <img id="imagePoisson" src="./static/images/Poisson1.png" alt="Poisson1">
</button>
<p id="nomPoisson">Poisson1</p>
    </div>
  </div>

  <!-- Colonne centrale : barre des paliers -->
  <div class="hidden" id="paliers">
    <button class="palier" id="palier-1">1</button>
    <button class="palier" id="palier-2">2</button>
    <button class="hidden palier" id="palier-3">3</button>
    <button class="hidden palier" id="palier-4">4</button>
    <button class="hidden palier" id="palier-5">5</button>
    <button class="hidden palier" id="palier-6">6</button>
    <button class="hidden palier" id="palier-7">7</button>
    <button class="hidden palier" id="palier-8">8</button>
    <button class="hidden palier" id="palier-9">9</button>
    <button class="hidden palier" id="palier-10">10</button>
    <button class="hidden palier" id="palier-11">11</button>
    <button class="hidden palier" id="palier-12">12</button>
    <button class="hidden palier" id="palier-13">13</button>
  </div>

  <!-- Colonne droite : argent + améliorations -->
  <div id="ameliorations-argent">
    <div id="argent">argent</div>
    <div id="ameliorations">
      <div id="a-clic">clic</div>
      <div id="a-passif">passif</div>
    </div>
  </div>

  <!-- Panneau succès -->
  <div id="succes-page">
    <div id="succes-titre">
      <p>Succés</p>
    </div>
    <div class="succes">
      <p>succes n°1</p>
    </div>
    <div class="succes">
      <p>succes n°1</p>
    </div>
  </div>

</div>

<!-- Bouton options fixe, en dehors du flux de la grille -->

<button id="options">Options</button>

<script src="./modele/jeu.js"></script>
<script src="./vue/jeu.js"></script>
<script src="./controller/jeu.js"></script>
<!-- Scripts JS dans l'ordre de dépendance -->
</body>
</html>
