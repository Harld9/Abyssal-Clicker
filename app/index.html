<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="./static/css/main.css" rel="stylesheet" />
    <link href="./static/css/index.css" rel="stylesheet" />

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />

    <title>Abyssal Clicker</title>
</head>

<body>
<div id="interface">

    <div id="poisson-score">
        <div id="score-bg">
            <div id="score">
                <p>Score</p>
                <p id="nbScore">0</p>
                <p>Nombre de clic</p>
                <p id="nbClic">0</p>
            </div>
        </div>

        <div id="poisson">
            <button class="imgPoisson" id="imgPoisson">
                <img src="./static/images/ui/wooden_play.png" alt="Poisson au chocolat">
                <span class="coin coin-hg"></span>
                <span class="coin coin-hd"></span>
                <span class="coin coin-bg"></span>
                <span class="coin coin-bd"></span>
            </button>
            <p id="nomPoisson">Commencez à jouer !</p>
        </div>
    </div>

    <div id="paliers">
        <button class="palier" id="palier-1">1</button>
        <button class="palier" id="palier-2">2</button>
        <button class="hidden palier" id="palier-3">3</button>
        <button class="hidden palier" id="palier-4">4</button>
        <button class="hidden palier" id="palier-5">5</button>
        <button class="hidden palier" id="palier-6">6</button>
        <button class="hidden palier" id="palier-7">7</button>
        <button class="hidden palier" id="palier-8">8</button>
        <button class="hidden palier" id="palier-9">9</button>
        <button class="hidden palier" id="palier-10">10</button>
        <button class="hidden palier" id="palier-11">11</button>
        <button class="hidden palier" id="palier-12">12</button>
        <button class="hidden palier" id="palier-13">13</button>
    </div>

    <div id="ameliorations-argent">
        <div id="argent">Argents :</div>

        <div id="a-titre">
            <p>Améliorations</p>
        </div>

        <div id="amelioration-page">
            <div id="a-clic">
                <div class="a-cli-pas-titre">
                    <p>Clic</p>
                    <p class="a-dps">0 dégâts/clic</p>
                </div>

                <div class="a-quantite-achat">
                    <button class="btn-quantite actif" data-quantite="1">x1</button>
                    <button class="btn-quantite" data-quantite="10">x10</button>
                    <button class="btn-quantite" data-quantite="100">x100</button>
                </div>

                <div class="a-box" id="liste-clic"></div>
            </div>

            <div id="a-passif">
                <div class="a-cli-pas-titre">
                    <p>Passif</p>
                    <p class="a-dps">0 dégâts/tick</p>
                </div>

                <div class="a-quantite-achat">
                    <button class="btn-quantite actif" data-quantite="1">x1</button>
                    <button class="btn-quantite" data-quantite="10">x10</button>
                    <button class="btn-quantite" data-quantite="100">x100</button>
                </div>

                <div class="a-box" id="liste-passif"></div>
            </div>
        </div>
    </div>

    <div id="succes-page">
        <div id="s-titre">
            <p>Succès</p>
        </div>

        <div id="s-box"></div>
    </div>
</div>

<button id="options">
    ⚙
</button>

<div id="modale-options" class="hidden">
    <div id="modale-bg">
        <button id="fermer-options">X</button>

        <div id="modale-contenu">
            <h2>OPTIONS</h2>

            <div class="modale-sauvegarde">
                <button id="recup-sauvegarde">Récupérer ma sauvegarde</button>
                <div class="modale-i-o" id="output-sauvegarde"></div>
            </div>

            <div class="modale-sauvegarde">
                <label for="input-sauvegarde"></label>
                <input class="modale-i-o" type="text" id="input-sauvegarde" />
                <button id="ajout-sauvegarde">Utiliser ma sauvegarde</button>
            </div>
        </div>
    </div>
</div>

<div id="succes-toast-container"></div>

<script src="./modele/jeu.js"></script>
<script src="./vue/jeu.js"></script>
<script src="./controller/jeu.js"></script>
<script src="./static/js/jeu.js" defer></script>
</body>
</html>
